create:
  name: Create one-shot schedule
  description: Run independent start and/or end actions once.
  fields:
    entity_id:
      name: Switch
      required: true
      selector:
        entity:
          domain: switch
    start_action:
      name: Start action
      required: true
      default: "on"
      selector:
        select:
          options:
            - label: Turn on
              value: "on"
            - label: Turn off
              value: "off"
            - label: Do nothing
              value: "none"
    start:
      name: Start
      required: false
      example: "2026-10-01T18:30:00+03:00"
      selector:
        text:
    end_action:
      name: End action
      required: true
      default: "off"
      selector:
        select:
          options:
            - label: Turn off
              value: "off"
            - label: Turn on
              value: "on"
            - label: Do nothing
              value: "none"
    end:
      name: End
      required: false
      example: "2026-10-01T19:15:00+03:00"
      selector:
        text:

add_time:
  name: Add time now
  description: Turn a switch on immediately and add minutes to its current active one-shot window.
  fields:
    entity_id:
      name: Switch
      required: true
      selector:
        entity:
          domain: switch
    minutes:
      name: Minutes to add
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box

cancel:
  name: Cancel schedule
  description: Cancel one pending schedule without changing the entity's current state.
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      selector:
        text:

clear:
  name: Clear all schedules
  description: Cancel all one-shot schedules without changing current entity states.
